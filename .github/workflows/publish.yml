name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag version=$version"
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in Directory.Build.props."
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match version $version in Directory.Build.props."
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/FileManagerNet/FileManagerNet.csproj -c Release -o artifacts --nologo

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: glenwu

      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
